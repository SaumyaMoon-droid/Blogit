<!DOCTYPE html>
<html>
<head>
    <title>Blogit</title>
    <link href=stylesheet.css rel="stylesheet">
</head>
<body>
    <div class="titlebox">
    <h1 id="web">Welcome to Blogit!</h1>
    <h2 id="writeabout">Write about anything that interests you</h2></div>
    <br>
    <div>
        <h2 id="cpost">Create a Post</h2>
        <form>
            <div id="title">
                <label for="titl"><b>Title:</b></label>
                <input id="titl" type="text" placeholder="What is the post about?">
            </div>
             <div id="post1">
                <label for="post"></label>
               <textarea id="post" rows="20" columns="10" placeholder="Write something..."></textarea>
            </div>
            <div id="tags">
                <label for="tag"><b>Tag:</b></label>
                <input type="text" id="tag" >
            </div>
            <button id="postenter" class="postbtn" type="submit">Post</button>
        </form>
    </div>
    <div id="feedBox" class="fypbox">
    <h2 id="feed"><b>Recent Posts</b></h2>
    </div>
    <button id="logout" class="logout1">Log Out</button>
        <div id="boxy">
    <div class="img1"></div>
</div>
</body>
<script src="script.js"></script>
</html>
