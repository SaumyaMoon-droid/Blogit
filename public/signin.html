<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Page</title>
      <link href=stylesheet.css rel="stylesheet">
</head>
<body>
    <h1>Sign Up to Blogit Now!</h1>
    <form id="signin" class="mybox">
         <div>
            <label for="Username">Username</label>
            <input type="text" placeholder="John Doe" id="Username">
        </div>
        <div>
            <label for="userEmail">Email Address:</label>
            <input type="email" id="userEmail" name="email" required>
        </div>
         <div>
            <label for="password">Password:</label>
            <input type="password" id="password" required>
        </div>
         <button type="submit" id="signinbtn">Sign Up</button>
    </form>
     <br>
    <a style="display: flex; justify-content: center;" href="login.html">Already an User? Log In</a>
    <script src="signin.js"></script>

</body>
</html>
